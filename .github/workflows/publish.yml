name: publish
# Every merge to main that passes the checks becomes a build on the "stable" branch, and every
# computer's Companion app installs it by itself (see docs/ARCHITECTURE.md, "Delivery"). Merging the
# PR is the approval; nothing is published by hand.
# The same build also goes to the public download folder (zips for a first install, and what the
# installed apps update from), so the repository itself stays private.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # the OIDC token the download folder's upload function checks
concurrency: publish
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Publish to stable, and build the download zips
        id: pub
        run: |
          git checkout -q -B main
          msg="$(git log -1 --format=%s)"
          # a merge from GitHub says "Merge pull request #n from ..."; the PR's title is the first line of the body
          case "$msg" in "Merge pull request "*) t="$(git log -1 --format=%b | sed -n '/./{p;q}')"; [ -n "$t" ] && msg="$t";; esac
          # a manual run always publishes; a merge publishes only when ClaudeCompanion/ changed
          force=""; [ "${{ github.event_name }}" = workflow_dispatch ] && force="--force"
          python3 tools/publish-stable.py $force --release dist "$msg"
      # The download folder (public to read; the repository stays private): the first-install zips and
      # latest.json, which every installed app's updater reads. supabase/functions/publish-build checks
      # this job's GitHub OIDC token (this repository, publish.yml, main), so no secret is stored anywhere.
      - name: Upload to the download folder
        if: steps.pub.outputs.published == 'true'
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-companion-publish" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          curl -sS --fail-with-body -X POST https://jucbngafdnyaizfxgplk.supabase.co/functions/v1/publish-build \
            -H "Authorization: Bearer $tok" -F "manifest=<dist/latest.json" \
            -F "ClaudeCompanion-Windows.zip=@dist/ClaudeCompanion-Windows.zip" -F "ClaudeCompanion-Mac.zip=@dist/ClaudeCompanion-Mac.zip"
          echo
          # check what a computer will read
          curl -sS --fail https://jucbngafdnyaizfxgplk.supabase.co/storage/v1/object/public/releases/latest.json
