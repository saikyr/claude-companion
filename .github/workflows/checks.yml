name: checks
on: [push, pull_request, workflow_dispatch]   # dispatch: the weekly pack rebuild runs these on its branch (pack.yml)
jobs:
  checks:
    runs-on: ubuntu-latest
    # the sync tests run the real backend SQL (supabase/migrations) on this Postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      # Nothing in this job may reach the live sync backend, whatever a later step starts.
      - name: Block the live sync backend
        run: |
          printf '0.0.0.0 jucbngafdnyaizfxgplk.supabase.co\n:: jucbngafdnyaizfxgplk.supabase.co\n' | sudo tee -a /etc/hosts
          ! curl -s --max-time 5 -o /dev/null https://jucbngafdnyaizfxgplk.supabase.co
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the contract check compares migrations with the branch this merges into
      - name: Contract between addon, servers, page and sync backend (docs/ARCHITECTURE.md, Contracts)
        # a PR compares with its base; a push to main with the commit before; a push to any other branch with main
        # (a later commit on a branch may change a migration an earlier commit of the same branch added)
        run: node test/contract.test.js "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && 'HEAD~1' || 'origin/main') }}"
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Addon harness (mock game API)
        run: |
          mkdir -p /tmp/h && cd /tmp/h
          lua5.1 -e "ADDONDIR='$GITHUB_WORKSPACE/ClaudeCompanion'" "$GITHUB_WORKSPACE/test/harness.lua" | tee run.log
          grep -q '^DONE' run.log
          ! grep -q '^FAIL' run.log
      - name: Lua syntax
        run: for f in ClaudeCompanion/*.lua; do luac5.1 -p "$f"; done
      - name: JavaScript syntax
        run: for f in ClaudeCompanion/web/js/*.js ClaudeCompanion/web/data/rules.js; do node --check "$f"; done
      - name: Game data complete (pack, random-suffix rolls, icons, rules; docs/ARCHITECTURE.md Data sources)
        run: |
          python3 -I gamedata/test_pack.py ClaudeCompanion/web/data/gamedata.js
          python3 -I tools/make-drops.py --check
          node test/web/data.test.js
      - name: App logic (stat weights, item advice)
        run: node test/web/advice.test.js
      - name: Gear scoring for every class and spec (trees, weights, weapon DPS per hand, shields, relics)
        run: node test/web/classes.test.js
      - name: Pre-BiS against published Forever lists (real game data; test/fixtures/bis-lists.json)
        run: node test/web/bis-lists.test.js
      - name: Quests you can do (chains, faction, class, reputation; Gear leaves out rewards you took)
        run: node test/web/quests.test.js
      - name: Spell ranks (bars below your best rank, the class trainer's list)
        run: node test/web/spells.test.js
      - name: The AH buy list (rules, backtests)
        run: node test/web/market.test.js
      - name: The app's own icons are original-client icons
        run: node test/web/icons.test.js
      - name: Python syntax
        run: python3 -m py_compile ClaudeCompanion/web/server.py gamedata/*.py tools/*.py
      - name: One character across computers (merge rules)
        run: node test/web/merge.test.js
      - name: History sync between computers (the real backend SQL on Postgres)
        run: node test/web/sync.test.js
      - name: Claude's cards through the real backend SQL
        run: node test/web/claude.test.js
      - name: Claude's brief through the real backend SQL
        run: node test/web/brief.test.js
      - name: Game data in the database, loaded from the real pack (labels, look-ups)
        run: node test/web/game.test.js
      - name: The answer rules, in Python and in the Postgres card gate, on the same cases
        run: node test/web/cards-gate.test.js
      - name: The weekly correction audit (tools/audit.py, docs/COACHING.md)
        run: python3 test/audit_test.py
      - name: The combat-log reader on sample logs (js/combatlog.js)
        run: node test/web/combatlog.test.js
      - name: Game-data loader syntax
        run: python3 -m py_compile tools/pack-to-rows.py tools/upload-game.py
      - name: History sync in the real app page (Chromium, the real backend SQL, the harness's save)
        run: |
          F=/tmp/f/_forever_
          mkdir -p $F/Interface/AddOns $F/WTF/Account/T/SavedVariables
          cp -r ClaudeCompanion $F/Interface/AddOns/
          cp /tmp/h/out.lua $F/WTF/Account/T/SavedVariables/ClaudeCompanion.lua
          echo '{"auto": false}' > $F/Interface/AddOns/ClaudeCompanion/companion-data/update.json
          (cd $F/Interface/AddOns/ClaudeCompanion/web && CC_PORT=47999 CC_BACKGROUND=0 nohup python3 server.py --serve > /tmp/server.log 2>&1 &)
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node test/web/sync-browser.js 47999 $F/Interface/AddOns/ClaudeCompanion/companion-data
      - name: Gear and Stat weights pages (Chromium, a made-up level 59 Priest)
        run: node test/web/gear-browser.js
      - name: Now page in a browser (next steps, filters, unlocks, snapshot)
        run: node test/web/next-browser.js
      - name: More than one character (picker, shared AH prices)
        run: node test/web/chars-browser.js
      - name: Local server API (server.py)
        run: node test/web/server-api.test.js 47999 /tmp/f/_forever_/Interface/AddOns/ClaudeCompanion/companion-data
      - name: Server rules (hidden browser)
        run: python3 test/server_test.py
      - name: Self-update, end to end (mock GitHub)
        run: python3 test/update_test.py && python3 test/update_test.py --url
      - name: From Claude cards format
        run: python3 tools/check-cards.py test/fixtures/cards.json
      - name: No personal data
        run: |
          ! git ls-files | grep -E 'SavedVariables|snapshot\.json$|settings\.json$|sync(-cache)?\.json$|combat\.json$|web/data\.js$'

  # The PC's server (server.ps1) under Windows PowerShell 5.1, the one Windows ships: the same API test.
  windows-server:
    runs-on: windows-latest
    steps:
      - name: Block the live sync backend
        shell: pwsh
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n0.0.0.0 jucbngafdnyaizfxgplk.supabase.co`n:: jucbngafdnyaizfxgplk.supabase.co"
      - uses: actions/checkout@v4
      - name: Local server API (server.ps1)
        shell: pwsh
        run: |
          $F = "$env:RUNNER_TEMP\f\_forever_"
          New-Item -ItemType Directory -Force "$F\Interface\AddOns", "$F\WTF\Account\T\SavedVariables" | Out-Null
          Copy-Item -Recurse ClaudeCompanion "$F\Interface\AddOns\"
          Set-Content -Path "$F\WTF\Account\T\SavedVariables\ClaudeCompanion.lua" -Value 'ClaudeCompanionDB = { ["schema"] = 1, ["chars"] = {} }'
          Set-Content -Path "$F\Interface\AddOns\ClaudeCompanion\companion-data\update.json" -Value '{"auto": false}'
          $env:CC_PORT = '47999'; $env:CC_BACKGROUND = '0'
          $srv = Start-Process -PassThru -NoNewWindow -FilePath powershell.exe -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$F\Interface\AddOns\ClaudeCompanion\web\server.ps1", '-Serve' -RedirectStandardOutput "$env:RUNNER_TEMP\server.log" -RedirectStandardError "$env:RUNNER_TEMP\server.err"
          node test/web/server-api.test.js 47999 "$F\Interface\AddOns\ClaudeCompanion\companion-data"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\server.log", "$env:RUNNER_TEMP\server.err" -ErrorAction SilentlyContinue }
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: Self-update, end to end (server.ps1, mock GitHub)
        run: python test/update_test.py --ps1 && python test/update_test.py --ps1 --url
