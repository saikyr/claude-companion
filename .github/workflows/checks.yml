name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Addon harness (mock game API)
        run: |
          mkdir -p /tmp/h && cd /tmp/h
          lua5.1 -e "ADDONDIR='$GITHUB_WORKSPACE/ClaudeCompanion'" "$GITHUB_WORKSPACE/test/harness.lua" | tee run.log
          grep -q '^DONE' run.log
          ! grep -q '^FAIL' run.log
      - name: Lua syntax
        run: for f in ClaudeCompanion/*.lua; do luac5.1 -p "$f"; done
      - name: JavaScript syntax
        run: for f in ClaudeCompanion/web/js/*.js; do node --check "$f"; done
      - name: App logic (stat weights, item advice)
        run: node test/web/advice.test.js
      - name: Python syntax
        run: python3 -m py_compile ClaudeCompanion/web/server.py gamedata/*.py
      - name: No personal data
        run: |
          ! git ls-files | grep -E 'SavedVariables|snapshot\.json$|web/data\.js$'
